
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLOUDPULSE | Login</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body class="center">

  <div class="auth-card" id="loginCard">
    <h1 class="brand">CLOUDPULSE</h1>
    <p class="subtitle">AI-Driven Cloud Cost Anomaly Detection</p>

    <form id="loginForm">
      <input name="username" placeholder="Username" required>
      <input name="password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p class="link">
      <a href="#" onclick="showForgot()">Forgot Password?</a>
    </p>
    <p class="link">
      New user? <a href="/signup.html">Create account</a>
    </p>
  </div>

  <!-- OTP Verification Card (Hidden) -->
  <div class="auth-card" id="otpCard" style="display: none;">
    <h1 class="brand">VERIFY EMAIL</h1>
    <p class="subtitle">Your account is not verified. <br>Enter code sent to <b id="displayEmail"></b></p>
    <form id="otpForm">
      <input id="otpInput" type="text" placeholder="######" maxLength="6" style="text-align: center; letter-spacing: 8px; font-size: 24px;" required>
      <button type="submit">Verify & Login</button>
    </form>
    <p class="link"><a href="#" onclick="resendOTP()">Resend Code</a></p>
  </div>

  <!-- Forgot Password Card (Hidden) -->
  <div class="auth-card" id="forgotCard" style="display: none;">
    <h1 class="brand">RECOVERY</h1>
    <p class="subtitle">Enter your email to receive a reset link</p>
    <form id="forgotForm">
      <input id="forgotEmail" type="email" placeholder="Email address" required>
      <button type="submit">Send Reset Link</button>
    </form>
    <p class="link"><a href="#" onclick="showLogin()">Back to Login</a></p>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const otpForm = document.getElementById("otpForm");
    const forgotForm = document.getElementById("forgotForm");
    const loginCard = document.getElementById("loginCard");
    const otpCard = document.getElementById("otpCard");
    const forgotCard = document.getElementById("forgotCard");
    const toastContainer = document.getElementById("toastContainer");

    let userEmail = "";

    function showToast(title, message, type = "error") {
      const toast = document.createElement("div");
      toast.className = `toast ${type}`;
      const icon = type === "error" ? "❌" : "✅";
      toast.innerHTML = `
        <div class="toast-icon">${icon}</div>
        <div class="toast-content">
          <div class="toast-title">${title}</div>
          <div class="toast-message">${message}</div>
        </div>
      `;
      toastContainer.appendChild(toast);
      setTimeout(() => toast.classList.add("show"), 10);
      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.remove(), 400);
      }, 4000);
    }

    function showForgot() { 
      loginCard.style.display = "none"; 
      forgotCard.style.display = "block"; 
      otpCard.style.display = "none";
    }
    
    function showLogin() { 
      loginCard.style.display = "block"; 
      otpCard.style.display = "none"; 
      forgotCard.style.display = "none"; 
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(loginForm);
      const data = Object.fromEntries(formData.entries());
      
      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        
        if (res.ok) {
          showToast("Success", "Welcome back!", "success");
          setTimeout(() => window.location.href = result.redirect, 800);
        } else if (res.status === 403 && result.needsVerification) {
          userEmail = result.email;
          document.getElementById("displayEmail").innerText = userEmail;
          loginCard.style.display = "none";
          otpCard.style.display = "block";
          showToast("Verification Required", "Please verify your email first.");
        } else {
          showToast("Login Failed", result.error);
        }
      } catch (err) {
        console.error(err);
        showToast("Error", "Server unreachable.");
      }
    });

    otpForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const otp = document.getElementById("otpInput").value;
      try {
        const res = await fetch("/verify-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: userEmail, otp })
        });
        const result = await res.json();
        if (res.ok) {
          showToast("Success", "Verified! Please login now.", "success");
          setTimeout(showLogin, 1500);
        } else {
          showToast("Failed", result.error);
        }
      } catch (e) {
        console.error(e);
        showToast("Error", "Request failed.");
      }
    });

    forgotForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("forgotEmail").value;
      const btn = forgotForm.querySelector("button");
      const originalText = btn.innerText;

      btn.disabled = true;
      btn.innerText = "⌛ Sending...";
      
      try {
        const res = await fetch("/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const result = await res.json();
        if (res.ok) {
          showToast("Sent", "Reset link is on its way!", "success");
        } else {
          showToast("Error", result.error);
        }
      } catch (e) {
        console.error(e);
        showToast("Error", "Request failed.");
      } finally {
        btn.disabled = false;
        btn.innerText = originalText;
      }
    });

    async function resendOTP() {
      try {
        await fetch("/resend-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: userEmail })
        });
        showToast("Sent", "New code sent!", "success");
      } catch (e) {
        showToast("Error", "Failed to resend.");
      }
    }
  </script>

</body>
</html>
